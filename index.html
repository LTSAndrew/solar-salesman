<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Defend your roof from a door-to-door solar salesman. A week of sprinklers, chihuahuas and fate cards on Sunny Lane.">
<meta name="theme-color" content="#141c33">
<title>Solar Salesman</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffc531' stroke='%23151a2c' stroke-width='2'/%3E%3Crect x='9' y='13' width='14' height='4' fill='%23151a2c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one arcade-cabinet column — HUD strip, pixel stage (2:3), gadget buttons in a 2-up grid. Single committed night-arcade look. */
:root {
  --night: #141c33;
  --panel: #1f2b4f;
  --rim: #2e3f70;
  --ink: #f3f5ff;
  --muted: #a7b2d4;
  --sun: #ffc531;
  --water: #6cc6ff;
  --tan: #e3b36a;
  --leaf: #9be36a;
  --steel: #c9ced8;
  --good: #4fd17a;
  --bad: #ff5a5f;
  --paper: #fffef8;
  --paper-ink: #151a2c;
  --display: "Silkscreen", "Courier New", monospace;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  -webkit-tap-highlight-color: transparent;
}
.cabinet {
  --chrome: 230px;
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  touch-action: manipulation;
}
.hud {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 6px 12px;
  align-items: center;
  background: var(--panel);
  border-radius: 10px;
  padding: 8px 10px 8px 12px;
}
.clock { font-family: var(--display); font-size: 18px; color: var(--sun); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock small { font-size: 12px; color: var(--muted); margin-right: 6px; }
.score { text-align: right; font-size: 12px; color: var(--muted); }
.score b { display: block; font-family: var(--display); font-size: 18px; color: var(--ink); font-weight: 400; font-variant-numeric: tabular-nums; }
.meter-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.meter-row span { font-family: var(--display); letter-spacing: .04em; text-transform: uppercase; font-size: 10px; white-space: nowrap; }
.meter { flex: 1; height: 10px; background: var(--night); border-radius: 5px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--good); transition: width .3s, background .3s; }
.meter.warn i { background: var(--sun); }
.meter.hot i { background: var(--bad); }
.snd {
  border: 0;
  border-radius: 8px;
  padding: 6px 8px;
  background: var(--night);
  color: var(--ink);
  font-family: var(--display);
  font-size: 10px;
  line-height: 1.2;
  cursor: pointer;
}

.stage {
  position: relative;
  width: min(100%, 420px, calc((100vh - var(--chrome)) * .6667));
  width: min(100%, 420px, calc((100dvh - var(--chrome)) * .6667));
  min-width: 240px;
  max-width: 100%;
  aspect-ratio: 2 / 3;
  margin-inline: auto;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 0 0 3px var(--rim), 0 10px 30px rgba(0,0,0,.45);
}
#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

.bubble {
  position: absolute;
  max-width: 62%;
  transform: translate(-50%, -100%);
  background: var(--paper);
  color: var(--paper-ink);
  border: 2px solid var(--paper-ink);
  border-radius: 10px;
  padding: 5px 8px;
  font-size: clamp(11px, 3.2vw, 13px);
  line-height: 1.25;
  font-weight: 700;
  pointer-events: none;
  text-align: center;
}
.bubble::after {
  content: "";
  position: absolute;
  left: 50%; bottom: -8px;
  margin-left: -6px;
  border: 6px solid transparent;
  border-top-color: var(--paper-ink);
  border-bottom: 0;
}
.floats { position: absolute; inset: 0; pointer-events: none; }
.float {
  position: absolute;
  transform: translate(-50%, 0);
  font-family: var(--display);
  font-size: 13px;
  color: var(--sun);
  text-shadow: 2px 0 var(--paper-ink), -2px 0 var(--paper-ink), 0 2px var(--paper-ink), 0 -2px var(--paper-ink);
  white-space: nowrap;
  animation: rise 1.1s ease-out forwards;
}
.float.water { color: var(--water); }
.float.dog { color: var(--tan); }
.float.leaf { color: var(--leaf); }
.float.steel { color: var(--paper); }
.float.fine { color: var(--bad); font-size: 12px; }
.float.flood { color: #fff3a6; }
.float.hoa, .float.guest { color: #e5b8ff; font-size: 10px; font-family: var(--body); font-weight: 700; }
.float.miss { color: var(--muted); font-size: 11px; }
@keyframes rise { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: 0 -28px; } }

.overlay {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  background: rgba(12, 17, 34, .9);
}
.title-screen { align-items: center; text-align: center; }
/* auto-margin spacers center short content but let tall content scroll from the top */
.title-screen::before, .title-screen::after, .end-screen::before, .end-screen::after, .pause-screen::before, .pause-screen::after { content: ""; margin-block: auto; }
.pause-screen { align-items: center; text-align: center; background: rgba(12, 17, 34, .94); }
.pause-screen h2 { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 7vw, 30px); line-height: 1; margin: 0; color: var(--sun); }
.menu-list { display: flex; flex-direction: column; gap: 10px; width: min(100%, 240px); }
.title-screen h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(24px, 8vw, 34px);
  line-height: 1;
  margin: 0;
  color: var(--sun);
  text-wrap: balance;
  text-shadow: 3px 3px 0 #b5531f;
}
.eyebrow { font-family: var(--display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.howto { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.35; max-width: 32ch; text-align: left; }
.howto li { padding-left: 16px; position: relative; }
.howto li::before { content: ""; position: absolute; left: 0; top: .45em; width: 7px; height: 7px; background: var(--sun); }
.howto li.new::before { background: var(--leaf); }
.portrait { image-rendering: pixelated; }
.title-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.day-pick { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.day-pick button {
  font-family: var(--display);
  font-size: 11px;
  border: 0;
  border-radius: 6px;
  padding: 6px 9px;
  background: var(--panel);
  color: var(--muted);
  cursor: pointer;
}
.day-pick button[aria-pressed="true"] { background: var(--sun); color: var(--paper-ink); }

.btn {
  font-family: var(--display);
  font-size: 15px;
  border: 0;
  border-radius: 8px;
  padding: 12px 20px;
  background: var(--sun);
  color: var(--paper-ink);
  box-shadow: 0 4px 0 #b37d00;
  cursor: pointer;
}
.btn:active { translate: 0 2px; box-shadow: 0 2px 0 #b37d00; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--rim); }
.btn:focus-visible, .card:focus-visible, .gadget:focus-visible, .snd:focus-visible, .day-pick button:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }

.door-top { display: flex; gap: 10px; align-items: flex-start; }
.door-top canvas { flex: none; width: 56px; height: 68px; }
.door-say {
  flex: 1;
  min-width: 0;
  background: var(--paper);
  color: var(--paper-ink);
  border-radius: 10px;
  padding: 8px 10px;
  font-weight: 700;
  font-size: 14px;
  line-height: 1.3;
  position: relative;
}
.door-say::before {
  content: "";
  position: absolute;
  left: -7px; top: 14px;
  border: 7px solid transparent;
  border-right-color: var(--paper);
  border-left: 0;
}
.door-label { font-family: var(--display); font-size: 11px; color: var(--muted); letter-spacing: .06em; margin: 0; display: flex; justify-content: space-between; }
.timer { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--sun); width: 100%; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: var(--paper);
  color: var(--paper-ink);
  border: 3px solid var(--paper-ink);
  border-radius: 8px;
  padding: 9px 10px;
  font-family: var(--body);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.25;
  box-shadow: 0 4px 0 #070a14;
  cursor: pointer;
}
.card:active { translate: 0 2px; box-shadow: 0 2px 0 #070a14; }
.card:disabled { opacity: .45; cursor: default; }
.card.picked { opacity: 1; outline: 3px solid var(--sun); }
.chip {
  flex: none;
  font-family: var(--display);
  font-size: 9px;
  font-weight: 400;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 3px 6px;
  border-radius: 4px;
  color: var(--paper-ink);
}
.risk-low .chip { background: #a6e8bb; }
.risk-med .chip { background: #ffe08a; }
.risk-high .chip { background: #ffb38a; }
.risk-doom .chip { background: var(--bad); color: var(--paper); }
.result { margin: 0; font-size: 14px; line-height: 1.35; padding: 8px 10px; border-radius: 8px; border-left: 4px solid; background: var(--panel); }
.result.good { border-color: var(--good); }
.result.bad { border-color: var(--bad); }
.result b { font-family: var(--display); font-weight: 400; font-size: 12px; display: block; margin-top: 4px; }
.result.good b { color: var(--good); }
.result.bad b { color: var(--bad); }


.end-screen h2 { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 6vw, 26px); line-height: 1.1; margin: 0; color: var(--sun); text-wrap: balance; }
.end-screen p { margin: 0; line-height: 1.4; max-width: 40ch; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 14px; background: var(--panel); padding: 10px 12px; border-radius: 8px; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-family: var(--display); font-variant-numeric: tabular-nums; text-align: right; }
.contract { background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 10px 12px; font-size: 13px; transform: rotate(-1.5deg); }
.contract-head { font-family: var(--display); font-size: 12px; border-bottom: 2px solid var(--paper-ink); padding-bottom: 4px; margin-bottom: 6px; }
.contract dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.contract dt { color: #5a6075; }
.contract dd { margin: 0; font-weight: 700; }
.contract .sig { font-style: italic; font-size: 16px; color: #1c3fa8; }
.end-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.brag { width: 100%; font: inherit; font-size: 13px; padding: 8px; border-radius: 6px; border: 1px solid var(--rim); background: var(--night); color: var(--ink); }
.teaser { font-size: 13px; color: var(--muted); }

.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.controls > .gadget:only-of-type,
.controls > .gadget.last-odd { grid-column: 1 / -1; }
.gadget {
  position: relative;
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: 10px;
  padding: 10px 8px;
  font-family: var(--display);
  font-size: 16px;
  letter-spacing: .03em;
  color: var(--paper-ink);
  background: var(--base);
  box-shadow: 0 4px 0 var(--edge);
  cursor: pointer;
  --charge: 1;
  --base: #2d5f86;
  --fill: var(--water);
  --edge: #0c2236;
}
.gadget.dog { --base: #6e512a; --fill: var(--tan); --edge: #33240f; }
.gadget.blower { --base: #3d6b2a; --fill: var(--leaf); --edge: #19300f; }
.gadget.garage { --base: #545a66; --fill: var(--steel); --edge: #22252b; }
.gadget.flood { --base: #6f6220; --fill: #fff3a6; --edge: #2e280b; }
.gadget::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--fill);
  transform-origin: left;
  transform: scaleX(var(--charge));
}
.gadget span { position: relative; }
.gadget small { position: relative; display: block; font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: 0; opacity: .85; }
.gadget:active { translate: 0 2px; box-shadow: 0 2px 0 var(--edge); }
.gadget.cooling { color: var(--ink); }
@media (prefers-reduced-motion: reduce) {
  .float { animation-duration: .6s; }
  @keyframes rise { from { opacity: 1; } to { opacity: 0; } }
}
</style>

<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
</style>
</head>
<body>
<main class="cabinet" id="cabinet">
  <header class="hud">
    <div class="clock"><small id="dayTag">MON</small><span id="clock">9:00 AM</span></div>
    <div class="score">Dignity removed<b id="score">0</b></div>
    <button class="snd" id="menuBtn" type="button" aria-haspopup="dialog" aria-label="Pause and open the menu">Menu</button>
    <div class="meter-row">
      <span>Temptation</span>
      <div class="meter" id="meter" role="meter" aria-label="Temptation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="meterFill"></i></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" width="160" height="240" aria-label="Your front yard on Sunny Lane"></canvas>
    <div class="bubble" id="bubble" hidden></div>
    <div class="floats" id="floats"></div>

    <section class="overlay title-screen" id="titleScreen">
      <p class="eyebrow" id="titleEyebrow">Day 1 · Monday on Sunny Lane</p>
      <h1>Solar Salesman</h1>
      <canvas class="portrait" id="titlePortrait" width="70" height="110" style="width:70px;height:110px"></canvas>
      <ul class="howto" id="howto"></ul>
      <div class="title-actions">
        <button class="btn" id="startBtn" type="button">Start Monday</button>
      </div>
      <div class="day-pick" id="dayPick" aria-label="Choose a day"></div>
    </section>

    <section class="overlay" id="doorScreen" hidden aria-live="polite">
      <p class="door-label"><span>Ding dong.</span><span id="handNo">Pitch 1</span></p>
      <div class="door-top">
        <canvas id="doorPortrait" width="56" height="68"></canvas>
        <div class="door-say" id="doorSay"></div>
      </div>
      <div class="timer"><i id="doorTimer"></i></div>
      <div class="cards" id="cards"></div>
      <p class="result" id="result" hidden></p>
    </section>

    <section class="overlay end-screen" id="endScreen" hidden>
      <p class="eyebrow" id="endEyebrow">Monday · 5:00 PM</p>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="contract" id="contract" hidden>
        <div class="contract-head">Residential Solar Lease</div>
        <dl>
          <dt>Term</dt><dd>300 months</dd>
          <dt>Escalator</dt><dd>2.9% per year</dd>
          <dt>Signed</dt><dd class="sig">You, apparently</dd>
        </dl>
      </div>
      <dl class="stats" id="stats"></dl>
      <div class="end-actions">
        <button class="btn" id="nextBtn" type="button" hidden>Start Tuesday</button>
        <button class="btn" id="againBtn" type="button">Play again</button>
        <button class="btn ghost" id="bragBtn" type="button">Copy brag</button>
        <button class="btn ghost" id="menuEndBtn" type="button">Choose a day</button>
      </div>
      <input class="brag" id="bragText" type="text" readonly hidden aria-label="Brag text to copy">
      <p class="teaser" id="teaser"></p>
    </section>

    <section class="overlay pause-screen" id="pauseScreen" hidden role="dialog" aria-labelledby="pauseTitle">
      <h2 id="pauseTitle">Paused</h2>
      <p class="eyebrow" id="pauseDay">Monday · 9:00 AM</p>
      <div class="menu-list">
        <button class="btn" id="resumeBtn" type="button">Resume</button>
        <button class="btn ghost" id="restartBtn" type="button">Restart Monday</button>
        <button class="btn ghost" id="titleBtn" type="button">Choose a day</button>
        <button class="btn ghost" id="sndBtn" type="button" aria-pressed="true">Sound: on</button>
      </div>
    </section>
  </div>

  <div class="controls" id="controls">
    <button class="gadget" id="fireBtn" type="button"><span>Sprinkler</span><small id="fireHint">Ready</small></button>
    <button class="gadget dog" id="dogBtn" type="button" hidden><span>Dog</span><small id="dogHint">Ready</small></button>
    <button class="gadget blower" id="blowBtn" type="button" hidden><span>Blower</span><small id="blowHint">Gas 3/3</small></button>
    <button class="gadget garage" id="garageBtn" type="button" hidden><span>Garage</span><small id="garageHint">Ready</small></button>
    <button class="gadget flood" id="floodBtn" type="button" hidden><span>Floodlight</span><small id="floodHint">Ready</small></button>
  </div>
</main>

<script>
(() => {
  const W = 160, H = 240, DAY_LEN = 45, DOOR_Y = 192, PATH_X = 80, DRIVE_X = 137;
  const COOL = 4.5, SPRAY = 0.6, SLIP = 0.6;
  const HOP_AT = 82, HOP_TO = 122, HOP_T = 0.7, CROUCH_T = 0.3;
  const DOG_COOL = 12, DOG_HOME = { x: 58, y: 207 }, MAILBOX = { x: 58, y: 36 }, GRILL = { x: 30, y: 150 };
  const BLOW_COOL = 1.6, BLOW_GAS = 3, GAS_PRICE = 200;
  const GARAGE_COOL = 7, GARAGE_ZONE = 128;
  const FLOOD_COOL = 10, DAZE_T = 2.4;
  const BOSS_HP = 12;
  const $ = id => document.getElementById(id);
  const cv = $('game'), ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const lastPick = new Map();
  function pick(arr) {
    let v, tries = 0;
    do { v = arr[Math.floor(Math.random() * arr.length)]; } while (arr.length > 1 && v === lastPick.get(arr) && ++tries < 6);
    lastPick.set(arr, v);
    return v;
  }
  // the dark wet patch on the lawn
  const inWet = (x, y) => ((x - 90) / 34) ** 2 + ((y - 100) / 46) ** 2 <= 1;

  // ---------- Days ----------
  const DAYS = {
    1: {
      name: 'Monday', tag: 'MON', speed: 11, reps: [['gary', 0]], star: 'gary',
      howto: [
        'Gary is coming up your walk. He has a clipboard and no shame.',
        'Tap <b>Sprinkler</b> when he\'s in the dark wet patch on the lawn.',
        'If he reaches your door, pick a card within 5 seconds.',
        'Hold out until 5:00 PM. Don\'t sign anything.'
      ],
      intro: 'Hi there! Got a minute? Or twenty-five years?',
      win: ['Monday survived', '5:00 PM. Gary goes home to blow-dry his clipboard. Your roof remains gloriously un-paneled.'],
      redemption: ['Gary found his calling', 'Gary quit solar and signed up for a pottery class. You changed a life. Bonus ending unlocked.']
    },
    2: {
      name: 'Tuesday', tag: 'TUE', speed: 12, reps: [['gary', 0]], star: 'gary',
      howto: [
        'Gary watched parkour videos all night. He now <b>hops over the middle</b> of the wet patch.',
        'Watch for the crouch. Soak him right before he jumps or right after he lands.',
        { cls: 'new', html: 'New: <b>Pickles</b> the chihuahua. Tap <b>Dog</b> to chase Gary back to the mailbox.' },
        { cls: 'new', html: 'Pickles will stop for a sandwich. Sometimes Gary brings one.' }
      ],
      intro: "I'm baaack! I've been training.",
      win: ['Tuesday survived', "Gary's parkour career ends in your azaleas. Pickles keeps his tie as a trophy."],
      redemption: ['Gary quit. Again.', 'Pottery class was full, but your lemonade got through to him. He is going to be a dog groomer. Pickles approves.']
    },
    3: {
      name: 'Wednesday', tag: 'WED', speed: 12.5, reps: [['gary', 0]], star: 'gary',
      howto: [
        'Gary made a <b>GO SOLAR!</b> poster board. It blocks the sprinkler.',
        { cls: 'new', html: 'New: <b>Leaf blower</b>. Blast the poster away, then soak him.' },
        { cls: 'new', html: 'The blower holds 3 blasts. More gas costs 200 dignity.' },
        'He still hops. Pickles still bites.'
      ],
      intro: 'Laminated poster board. Your move, garden hose.',
      win: ['Wednesday survived', "Gary's poster is stuck in the neighbor's tree. It now reads GO SOL. The AR blew away."],
      redemption: ['Gary quit. For real this time?', 'He is opening a lemonade stand. He asked for your recipe and a cut of the sprinkler money.']
    },
    4: {
      name: 'Thursday', tag: 'THU', speed: 13, reps: [['gary', 0]], star: 'gary', hoa: true,
      howto: [

    comboFloat(r, 'dog');
    sfx.yip();
    if (hurtBoss(r, 2)) { dog.mode = 'return'; return; }
    r.mode = 'chase'; r.chase = { stage: 'run', t: 0, ang: 0 }; r.lift = 0;
    dog.mode = 'chase';
    say(r.K.boss ? 'Is that a CHIHUAHUA? I am a SUN!' : pick(DOG_LINES), 2.2, r);
  }

  function soakBystander(b, isHoa) {
    b.hit = true;
    const fine = isHoa ? 300 : 150, temp = isHoa ? 15 : 5;
    stats.fines++;
    addScore(-fine);
    temptation = Math.min(100, temptation + temp);
    burst(b.x, b.y - 10, 12, 50);
    floater((isHoa ? 'HOA fine −' : 'Guest soaked −') + fine, b.x, b.y - 34, 'fine');
    if (isHoa) floater('Temptation +' + temp, b.x, b.y - 20, 'miss');
    else { floater(pick(GUEST_SOAK), b.x, b.y - 22, 'guest'); b.wet = 3; }
    sfx.fine();
    const talker = leadRep();
    if (talker && isHoa) say(pick(FINE_LINES), 2.4, talker);
    if (temptation >= 100) later(() => { if (phase === 'play') endGame('lose', isHoa ? 'hoa' : 'guests'); }, 900);
  }

  // ---------- Door ----------
  const doorScreen = $('doorScreen');
  function openDoor(r) {
    phase = 'door';
    doorRep = r;
    stats.doorVisits++;
    hideBubble();
    sfx.knock();
    hands = 0;
    drawPortrait($('doorPortrait'), r.kind, false);
    doorScreen.hidden = false;
    nextHand();
  }
  function nextHand() {
    hands++;
    resolved = false;
    doorTime = 5;
    $('handNo').textContent = `${doorRep.K.name} · Pitch ${hands}`;
    $('doorSay').textContent = pick(L[doorRep.kind].door);
    $('result').hidden = true;
    const pool = CARDS.filter(c => !c.minDay || day >= c.minDay);
    const deck = pool.slice().sort(() => Math.random() - .5).slice(0, 3);
    if (Math.random() < (doorRep.K.boss ? .35 : .25)) deck[Math.floor(Math.random() * 3)] = SIGN;
    const wrap = $('cards');
    wrap.innerHTML = '';
    deck.forEach((card, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.id = 'card-' + i;
      b.className = 'card risk-' + card.risk;
      const tt = document.createElement('span'); tt.textContent = card.title;
      const chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = RISK_LABEL[card.risk];
      b.append(tt, chip);
      b.addEventListener('click', () => playCard(card, b));
      wrap.appendChild(b);
    });
    const first = $('card-0'); if (first) first.focus({ preventScroll: true });
  }
  function showResult(text, kind, tag) {
    const r = $('result');
    r.className = 'result ' + kind;
    r.textContent = text;
    if (tag) { const b = document.createElement('b'); b.textContent = tag; r.appendChild(b); }
    r.hidden = false;
  }
  function lockCards(btn) {
    document.querySelectorAll('#cards .card').forEach(c => { c.disabled = true; });
    if (btn) btn.classList.add('picked');
  }
  function addTemptation(n) { temptation = Math.min(100, temptation + n); updateHud(); }
  function afterFail() {
    later(() => {
      if (phase !== 'door') return;
      if (temptation >= 100) endGame('lose'); else nextHand();
    }, 2300);
  }
  function playCard(card, btn) {
    if (resolved || phase !== 'door') return;
    resolved = true;
    lockCards(btn);
    if (card.id === 'sign') {
      temptation = 100; updateHud();
      showResult(`You signed. ${doorRep.K.boss ? 'The Regional Manager' : doorRep.K.name} does a cartwheel on your lawn.`, 'bad', 'Oh no');
      sfx.trombone();
      later(() => endGame('lose'), 1800);
      return;
    }
    const boss = doorRep.K.boss;
    if (Math.random() < card.p * (boss ? .8 : 1)) {
      addScore(card.pts); stats.doorWins++; updateHud();
      sfx.ding();
      showResult(card.win, 'good', '+' + card.pts + ' dignity removed');
      if (card.redemption) { later(() => endGame('redemption'), 2400); return; }
      later(() => {
        if (phase !== 'door') return;
        doorScreen.hidden = true;
        phase = 'play';
        doorRep.mode = 'fly'; doorRep.spin = 0; doorRep.poster = false;
        sfx.trombone();
      }, 2100);
    } else {
      const add = boss ? 45 : 35;
      addTemptation(add);
      sfx.bwomp();
      showResult(card.lose, 'bad', 'Temptation +' + add);
      afterFail();
    }
  }
  function timeout() {
    resolved = true;
    lockCards();
    addTemptation(40);
    sfx.bwomp();
    showResult('You froze. They take silence as a "maybe."', 'bad', 'Temptation +40');
    afterFail();
  }

  // ---------- End ----------
  function endGame(kind, cause) {
    phase = 'over';
    doorScreen.hidden = true;
    hideBubble();
    const D = DAYS[day], won = kind !== 'lose';
    if (won) unlock(day + 1);
    let T, eyebrow;
    const loseText = {
      hoa: 'The HOA fines piled up and Gary was standing right there with a pen. Your payments start in 30 days and end in 2051.',
      guests: 'Your soaked guests went home. You were lonely. Gary was there. Your payments start in 30 days and end in 2051.'
    }[cause] || 'They are already doing cartwheels. Your monthly payment starts in 30 days and ends in the year 2051.';
    let weekKey = null;
    if (day === LAST_DAY && won) {
      weekKey = kind === 'redemption' ? 'redemption' : stats.doorVisits === 0 ? 'secret' : 'standard';
      foundEnding(weekKey);
      T = WEEK_ENDINGS[weekKey];
      eyebrow = 'Sunday · ' + (cause === 'deflate' ? 'Regional Manager deflated' : kind === 'redemption' ? 'Bonus ending' : '5:00 PM') + ' · Week complete';
    } else {
      T = kind === 'win' ? D.win : kind === 'redemption' ? D.redemption : ['Congratulations on your 25-year solar lease!', loseText];
      eyebrow = `${D.name} · ` + (kind === 'win' ? '5:00 PM' : kind === 'redemption' ? 'Bonus ending' : 'Game over');
    }
    $('endTitle').textContent = T[0];
    $('endText').textContent = T[1];
    $('endEyebrow').textContent = eyebrow;
    $('contract').hidden = won;

    const rows = [['Dignity removed', score.toLocaleString()], ['Soakings', stats.soaks]];
    if (day >= 2) rows.push(['Dog chases', stats.chases]);
    if (day >= 3) rows.push(['Blower blasts', stats.blasts]);
    if (day >= 4) rows.push(['Recycling trips', stats.trips]);
    if (day >= 5) rows.push(['Floodlight flashes', stats.flashes]);
    if (DAYS[day].hoa || DAYS[day].guests) rows.push([DAYS[day].hoa ? 'HOA fines' : 'Guests soaked', stats.fines]);
    if (DAYS[day].boss) rows.push(['Air left in the sun', Math.round(stats.hpLeft / BOSS_HP * 100) + '%']);
    rows.push(['Door visits', stats.doorVisits], ['Temptation', temptation + '%']);
    const dl = $('stats');
    dl.innerHTML = '';
    rows.forEach(([k, v]) => {
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      dl.append(dt, dd);
    });

    $('bragText').hidden = true;
    $('bragBtn').textContent = 'Copy brag';
    const next = DAYS[day + 1];
    const nextBtn = $('nextBtn'), againBtn = $('againBtn');
    nextBtn.hidden = !(won && next);
    if (next) nextBtn.textContent = 'Start ' + next.name;
    againBtn.textContent = won ? 'Replay ' + D.name : 'Try ' + D.name + ' again';
    againBtn.classList.toggle('ghost', won && !!next);
    if (weekKey) {
      const list = ['standard', 'secret', 'redemption'].map(k => endingsFound.includes(k) ? ENDING_NAMES[k] : '???').join(', ');
      $('teaser').textContent = `Endings found: ${endingsFound.length} of 3 (${list}).`;
    } else $('teaser').textContent = won ? (TEASERS[day] || '') : '';

    $('endScreen').hidden = false;
    if (kind === 'lose') sfx.trombone();
    else if (weekKey) sfx.fanfare();
    else { sfx.ding(); setTimeout(sfx.ding, 250); }
    updateHud();
    (nextBtn.hidden ? againBtn : nextBtn).focus({ preventScroll: true });
  }
  function bragText() {
    const name = DAYS[day].name;
    if (temptation >= 100) return `I removed ${score.toLocaleString()} points of dignity from a solar salesman and still signed a 25-year solar lease on ${name}. Your move.`;
    if (day === LAST_DAY) return `I survived a full week of solar salesmen on Sunny Lane and deflated the Regional Manager. ${score.toLocaleString()} points. Your move.`;
    return `I removed ${score.toLocaleString()} points of dignity from a solar salesman and survived ${name} on Sunny Lane. Your move.`;
  }

  // ---------- Loop ----------
  function moveToward(o, tx, ty, speed, dt) {
    const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
    if (d < .5) return 0;
    const step = Math.min(d, speed * dt);
    o.x += dx / d * step; o.y += dy / d * step;
    return d - step;
  }

  function updateDog(dt) {
    if (day < 2) return;
    if (dog.cool > 0) dog.cool = Math.max(0, dog.cool - dt * (dog.mode === 'home' ? 1 : .5));
    const prevX = dog.x, r = dog.target;
    switch (dog.mode) {
      case 'run': {
        if (!r || !onLawn(r)) {
          const alt = leadRep();
          if (alt) dog.target = alt; else { dog.mode = 'return'; break; }
        }
        const tr = dog.target;
        const left = moveToward(dog, tr.x, tr.y, 95, dt);
        dog.walk += dt;
        if (left < 6 && tr.mode !== 'hop') dogCatch(tr);
        break;
      }
      case 'grill': {
        const left = moveToward(dog, GRILL.x + 6, GRILL.y, 90, dt);
        dog.walk += dt;
        if (left < 1) {
          dog.mode = 'eat'; dog.timer = 2.4;
          floater('Pickles stole a hot dog', GRILL.x + 10, GRILL.y - 24, 'dog');
          sfx.munch();
        }
        break;
      }
      case 'chase':
        dog.walk += dt;
        if (r && r.chase && r.chase.stage === 'run') {
          if (Math.hypot(r.x - dog.x, r.y - dog.y) > 9) moveToward(dog, r.x, r.y, 66, dt);
        } else if (r && r.chase) {
          const rad = r.K.boss ? 22 : 16;
          dog.x = MAILBOX.x + Math.cos(r.chase.ang - 1.1) * rad;
          dog.y = MAILBOX.y + 4 + Math.sin(r.chase.ang - 1.1) * rad;
        } else dog.mode = 'return';
        break;
      case 'eat':
        dog.timer -= dt;
        if (dog.timer <= 0) { dog.mode = 'return'; sandwich = null; }
        break;
      case 'return': {
        const left = moveToward(dog, DOG_HOME.x, DOG_HOME.y, 70, dt);
        dog.walk += dt;
        if (left < 1) { dog.mode = 'home'; dog.x = DOG_HOME.x; dog.y = DOG_HOME.y; dog.target = null; }
        break;
      }
    }
    if (Math.abs(dog.x - prevX) > .01) dog.flip = dog.x < prevX;
  }

  function updateHoa(dt) {
    if (!DAYS[day].hoa) return;
    if (!hoa.active) {
      hoa.next -= dt;
      if (hoa.next <= 0 && t < DAY_LEN - 6) {
        hoa.active = true; hoa.dir = Math.random() < .5 ? 1 : -1;
        hoa.x = hoa.dir > 0 ? -10 : 170; hoa.y = 92 + Math.floor(Math.random() * 16);
        hoa.talk = 1.5;
      }
      return;
    }
    hoa.x += hoa.dir * 15 * dt; hoa.walk += dt;
    hoa.talk -= dt;
    if (hoa.talk <= 0) { floater(pick(HOA_SAYS), hoa.x, hoa.y - 30, 'hoa'); hoa.talk = 3.5; }
    if (hoa.x < -14 || hoa.x > 174) { hoa.active = false; hoa.next = 9 + Math.random() * 5; }
  }

  function updateGuests(dt) {
    for (const gu of guests) {
      if (gu.wet > 0) gu.wet -= dt;
      gu.talk -= dt;
      if (gu.talk <= 0) { floater(pick(GUEST_CHAT), gu.x, gu.y - 28, 'guest'); gu.talk = 8 + Math.random() * 8; }
      if (gu.pause > 0) { gu.pause -= dt; continue; }
      const left = moveToward(gu, gu.tx, gu.ty, 6, dt);
      gu.walk += dt;
      if (left < .5) {
        gu.pause = 1 + Math.random() * 2.5;
        gu.tx = gu.hx + (Math.random() - .5) * 20;
        gu.ty = gu.hy + (Math.random() - .5) * 16;
      }
    }
    if (day === 6 && Math.random() < dt * 4) particles.push({ x: GRILL.x + (Math.random() - .5) * 6, y: GRILL.y - 14, vx: (Math.random() - .5) * 4, vy: -14, g: -2, life: 1.4, col: Math.random() < .5 ? '#d8d8d8' : '#b9b9b9' });
  }

  const routeX = r => r.route === 'drive' ? DRIVE_X : PATH_X;

  function arrive(r) {
    r.mode = 'door';
    floater('Ding dong!', r.x, headY(r) - 10);
    openDoor(r);
  }

  function updateRep(r, dt) {
    if (r.daze > 0) r.daze -= dt;
    switch (r.mode) {
      case 'enter': {
        const tx = routeX(r);
        r.x += Math.sign(tx - r.x) * 28 * dt; r.walk += dt;
        if (Math.abs(r.x - tx) < 1) { r.x = tx; r.mode = 'walk'; }
        break;
      }
      case 'walk': {
        r.walk += dt;
        const tx = routeX(r);
        if (Math.abs(r.x - tx) > 1) { r.x += Math.sign(tx - r.x) * 30 * dt; break; }
        r.x = tx;
        const before = r.y;
        r.y += r.speed * dt;
        if (r.route === 'path' && r.K.hop && day >= 2 && before < HOP_AT && r.y >= HOP_AT) { r.y = HOP_AT; r.mode = 'crouch'; r.timer = CROUCH_T; break; }
        if (r.y >= DOOR_Y) {
          r.y = DOOR_Y;
          if (r.route === 'drive') r.mode = 'porch';
          else if (phase === 'play') arrive(r);
        }
        break;
      }
      case 'porch':
        r.walk += dt;
        r.x -= 26 * dt;
        if (r.x <= 90) { r.x = 90; if (phase === 'play') arrive(r); }
        break;
      case 'crouch':
        r.timer -= dt;
        if (r.timer <= 0) {
          r.mode = 'hop'; r.timer = HOP_T; r.hopFrom = r.y;
          sfx.hop();
          if (Math.random() < .5 && bubbleT <= 0) say(pick(HOP_LINES), 1.3, r);
        }
        break;
      case 'hop': {
        r.timer -= dt;
        const k = Math.min(1, 1 - r.timer / HOP_T);
        r.y = r.hopFrom + (HOP_TO - r.hopFrom) * k;
        r.lift = Math.sin(Math.PI * k) * 16;
        if (r.timer <= 0) { r.lift = 0; r.y = HOP_TO; r.mode = 'walk'; }
        break;
      }
      case 'slip': {
        r.timer -= dt;
        const k = 1 - Math.max(0, r.timer) / r.slipT;
        r.y = r.slipFrom + (r.slipTo - r.slipFrom) * (1 - (1 - k) * (1 - k));
        if (r.soaked && Math.random() < .3) burst(r.x, r.y - 8, 1, 30);
        if (r.timer <= 0) { r.mode = 'stun'; r.timer = .45; }
        break;
      }
      case 'stun':
        r.timer -= dt;
        if (r.timer <= 0) { r.mode = 'walk'; r.daze = 0; }
        break;
      case 'chase': {
        r.walk += dt * 1.6;
        const c = r.chase, rad = r.K.boss ? 22 : 16;
        if (c.stage === 'run') {
          const left = moveToward(r, MAILBOX.x, MAILBOX.y + 4 + rad, 58, dt);
          if (left < 1) { c.stage = 'orbit'; c.ang = Math.PI / 2; c.t = 2.6; }
        } else {
          c.ang += 4.2 * dt; c.t -= dt;
          r.x = MAILBOX.x + Math.cos(c.ang) * rad;
          r.y = MAILBOX.y + 4 + Math.sin(c.ang) * rad;
          if (c.t <= 0) {
            r.mode = 'enter'; r.chase = null;
            if (r.y < 26) r.y = 26;
            dog.mode = 'return';
            say(r.K.boss ? 'That dog has a future in sales.' : pick(DOG_DONE_LINES), 2.4, r);
          }
        }
        break;
      }
      case 'deflate':
        r.timer -= dt; r.spin += dt * 10;
        r.x += Math.sin(anim * 9) * 70 * dt;
        r.y -= 55 * dt;
        if (Math.random() < .5) particles.push({ x: r.x, y: r.y - 10, vx: (Math.random() - .5) * 20, vy: 30, g: 0, life: .4, col: '#ffffff' });
        if (r.timer <= 0 && phase === 'play') endGame('win', 'deflate');
        break;
      case 'fly':
        r.y -= 170 * dt; r.spin += dt * 14;
        if (r.y < -30) { r.mode = 'wait'; r.timer = 1.4; if (bubbleRep === r) hideBubble(); }
        break;
      case 'wait':
        r.timer -= dt;
        if (r.timer <= 0) {
          r.returns++;
          r.route = r.K.drive && day >= 4 && Math.random() < .5 ? 'drive' : 'path';
          const fromRight = r.route === 'drive' || (r.kind === 'brayden' ? r.returns % 2 === 0 : r.returns % 2 === 1);
          r.x = fromRight ? 172 : -12; r.y = 18;
          r.mode = 'enter'; r.spin = 0; r.approachHits = 0; r.soaked = false;
          r.poster = r.K.poster && day >= 3;
          r.speed = (r.K.speed || DAYS[day].speed) + Math.max(0, r.returns) * (r.K.boss ? .6 : 1.3);
          const lines = L[r.kind];
          say(r.returns === 0 && lines.intro ? lines.intro : r.route === 'drive' && !r.K.boss ? pick(DRIVE_LINES) : pick(lines.ret), 2.6, r);
        }
        break;
    }
  }

  function update(dt) {
    anim += dt;
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g ?? 140) * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    if (bubbleT > 0) { bubbleT -= dt; if (bubbleT <= 0) hideBubble(); }
    if (flyingPoster) {
      flyingPoster.x += flyingPoster.vx * dt; flyingPoster.y += flyingPoster.vy * dt; flyingPoster.spin += dt * 9;
      if (flyingPoster.y < -20) flyingPoster = null;
    }
    if (garage.open > 0) garage.open = Math.max(0, garage.open - dt);
    if (flood.flash > 0) flood.flash = Math.max(0, flood.flash - dt);

    if (phase === 'door' && !resolved) {
      doorTime -= dt;
      $('doorTimer').style.width = Math.max(0, doorTime / 5 * 100) + '%';
      if (doorTime <= 0) timeout();
    }
    if (phase !== 'play') return;

    t += dt;
    if (t >= DAY_LEN) { endGame('win'); return; }

    spr.cool = Math.max(0, spr.cool - dt);
    blower.cool = Math.max(0, blower.cool - dt);
    garage.cool = Math.max(0, garage.cool - dt);
    flood.cool = Math.max(0, flood.cool - dt);

    if (spr.spray > 0) {
      spr.spray -= dt;
      for (let i = 0; i < 7; i++) {
        const a = Math.PI + (Math.random() - .5) * 2.0, sp = 45 + Math.random() * 40;
        particles.push({ x: 104, y: 98, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 10, life: .45 + Math.random() * .2, col: Math.random() < .75 ? '#6cc6ff' : '#e8f7ff' });
      }
      for (const r of reps) {
        if (r.sprayDone || !inWet(r.x, r.y)) continue;
        if (SOAKABLE.includes(r.mode)) {
          spr.any = true;
          if (r.poster) {
            r.sprayDone = true;
            floater('Blocked!', r.x, headY(r) - 10, 'miss');
            burst(r.x + 8, r.y - 20, 10, 40);
            sfx.block();
            say(pick(BLOCK_LINES), 1.6, r);
          } else hitRep(r);
        } else if (r.mode === 'hop') {
          r.sprayDone = true; spr.any = true;
          floater('Hopped it!', r.x, headY(r) - 10, 'miss');
        }
      }
      if (hoa.active && !hoa.hit && inWet(hoa.x, hoa.y)) { soakBystander(hoa, true); spr.any = true; }
      for (const gu of guests) if (!gu.hit && inWet(gu.x, gu.y)) { soakBystander(gu, false); spr.any = true; }
      if (spr.spray <= 0 && !spr.any) floater('Missed', 96, 84, 'miss');
    }

    if (blower.blast > 0) {
      blower.blast -= dt;
      const tx = blower.target && (onLawn(blower.target) || blower.target.mode === 'slip') ? blower.target.x : 80;
      for (let i = 0; i < 4; i++) {
        particles.push({ x: 80 + (Math.random() - .5) * 8, y: 196, vx: (tx - 80) * .8 + (Math.random() - .5) * 30, vy: -150 - Math.random() * 60, g: 30,
          life: .7 + Math.random() * .3, col: ['#9be36a', '#e2a23b', '#c46a2a', '#ffffff'][Math.floor(Math.random() * 4)] });
      }
    }

    chatter -= dt;
    if (chatter <= 0 && bubbleT <= 0) {
      const walkers = reps.filter(r => r.mode === 'walk');
      if (walkers.length) { const r = pick(walkers); say(pick(L[r.kind].walk), 2.6, r); }
      chatter = 5 + Math.random() * 3;
    }

    for (const r of reps) { updateRep(r, dt); if (phase !== 'play') break; }
    updateDog(dt);
    updateHoa(dt);
    updateGuests(dt);
    updateHud();
  }

  // ---------- Render ----------
  function drawRep(r) {
    if (r.mode === 'wait' || phase === 'title') return;
    const moving = ['walk', 'enter', 'chase', 'porch'].includes(r.mode);
    const step = Math.floor(r.walk * 6) % 2;
    let angle = 0;
    if (r.mode === 'slip') angle = Math.sin(anim * 30) * .35;
    else if (r.mode === 'stun') angle = Math.sin(anim * (r.daze > 0 ? 6 : 12)) * (r.daze > 0 ? .2 : .08);
    else if (r.mode === 'fly' || r.mode === 'deflate') angle = r.spin;
    else if (r.mode === 'chase') angle = Math.sin(anim * 20) * .12;
    else if (r.mode === 'hop') angle = -.15;
    const rx = Math.round(r.x), ry = Math.round(r.y);
    if (r.mode !== 'fly' && r.mode !== 'deflate') { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(rx - (r.K.boss ? 9 : 5), ry - 1, r.K.boss ? 18 : 10, 2); }

    if (r.K.boss) {
      const k = r.mode === 'deflate' ? Math.max(.25, .55 * r.timer / 2.4) : .55 + .45 * r.hp / BOSS_HP;
      ctx.save();
      if (r.mode === 'deflate' || r.mode === 'fly' || r.mode === 'slip' || r.mode === 'stun') {
        ctx.translate(rx, ry - 20); ctx.rotate(angle); ctx.translate(-rx, -(ry - 20));
      }
      drawBoss(ctx, rx, ry - (moving && step ? 1 : 0), k, 0, moving ? step : 0);
      ctx.restore();
      if (r.mode !== 'deflate' && r.mode !== 'fly') {
        const bw = 22, top = ry - 7 - 26 * k - 18;
        ctx.fillStyle = '#1b1b22'; ctx.fillRect(rx - bw / 2 - 1, top - 1, bw + 2, 4);
        ctx.fillStyle = '#ffd23a'; ctx.fillRect(rx - bw / 2, top, Math.round(bw * r.hp / BOSS_HP), 2);
      }
      if (r.daze > 0) drawStars(rx, ry - 7 - 26 * k - 4);
      return;
    }

    const top = r.kind === 'brayden' ? B_TOP : G_TOP;
    const rows = r.mode === 'crouch' ? top.concat(LEGS_CROUCH) : top.concat(moving ? (step ? LEGS_A : LEGS_B) : LEGS_STAND);
    ctx.save();
    const crouchDrop = r.mode === 'crouch' ? -3 : 0;
    ctx.translate(rx, ry - 10 - Math.round(r.lift || 0) - crouchDrop - (moving && step ? 1 : 0));
    if (angle) ctx.rotate(angle);
    if (r.mode === 'fly') ctx.scale(.8, .8);
    drawSprite(ctx, rows, -6, -10, 1, true);
    if (Math.floor(anim * 3) % 2 || r.mode === 'chase') { ctx.fillStyle = '#9fdcff'; ctx.fillRect(4, -8, 1, 2); if (r.mode === 'chase') ctx.fillRect(-5, -7, 1, 2); }
    if (r.soaked) { ctx.fillStyle = '#6cc6ff'; ctx.fillRect(-3, -1, 1, 2); ctx.fillRect(1, 1, 1, 2); ctx.fillRect(-1, 3, 1, 1); }
    if (r.poster) drawPoster(ctx, 5, -6);
    ctx.restore();
    if (r.daze > 0) drawStars(rx, ry - 32);
  }
  function drawStars(x, y) {
    for (let i = 0; i < 3; i++) {
      const a = anim * 5 + i * 2.1;
      ctx.fillStyle = i % 2 ? '#fff3a6' : '#ffc531';
      ctx.fillRect(Math.round(x + Math.cos(a) * 7), Math.round(y + Math.sin(a) * 2), 2, 2);
    }
  }

  function drawDog() {
    if (day < 2 || !dog || phase === 'title') return;
    const dx = Math.round(dog.x), dy = Math.round(dog.y);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(dx - 4, dy - 1, 8, 2);
    if (dog.mode === 'home') { drawSprite(ctx, DOG_SIT, dx - 3, dy - 8, 1, true); return; }
    const step = Math.floor(dog.walk * 10) % 2;
    const rows = DOG_BODY.concat(dog.mode === 'eat' || step ? DOG_LEGS_A : DOG_LEGS_B);
    ctx.save();
    ctx.translate(dx, dy - 6 - (dog.mode === 'eat' ? 0 : step));
    if (dog.flip) ctx.scale(-1, 1);
    drawSprite(ctx, rows, -5, 0, 1, true);
    ctx.restore();
  }
  function drawHoa() {
    if (!DAYS[day].hoa || !hoa.active) return;
    const hx = Math.round(hoa.x), hy = Math.round(hoa.y);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(hx - 4, hy - 1, 8, 2);
    ctx.save();
    ctx.translate(hx, hy - 14);
    if (hoa.dir < 0) ctx.scale(-1, 1);
    drawSprite(ctx, Math.floor(hoa.walk * 5) % 2 ? HOA_A : HOA_B, -4, 0, 1, true);
    ctx.restore();
  }
  function drawGuest(gu) {
    const gx = Math.round(gu.x), gy = Math.round(gu.y);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(gx - 4, gy - 1, 8, 2);
    const moving = gu.pause <= 0;
    drawSprite(ctx, moving && Math.floor(gu.walk * 5) % 2 ? GUEST_B : GUEST_A, gx - 4, gy - 12, 1, true, { u: gu.shirt, h: gu.hair });
    if (gu.wet > 0) { ctx.fillStyle = '#6cc6ff'; ctx.fillRect(gx - 2, gy - 6, 1, 2); ctx.fillRect(gx + 2, gy - 4, 1, 2); }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0);
    drawGarageDoor(garage.open > 0 ? Math.min(1, garage.open * 3, (1.6 - garage.open) * 6) : 0);
    if (day >= 5) drawFloodlight(flood.flash > 0);
    if (day === 6) drawBarbecue();
    if (spr && spr.spray > 0) { ctx.fillStyle = '#c4ccd8'; ctx.fillRect(103, 95, 3, 4); }
    if (day >= 3 && blower.blast > 0) {
      ctx.fillStyle = '#1b1b22'; ctx.fillRect(76, 196, 9, 6);
      ctx.fillStyle = '#e04a2a'; ctx.fillRect(77, 197, 7, 4);
    }
    if (sandwich) {
      const sx = Math.round(sandwich.x), sy = Math.round(sandwich.y);
      ctx.fillStyle = '#1b1b22'; ctx.fillRect(sx - 3, sy - 4, 7, 5);
      ctx.fillStyle = '#e8c27a'; ctx.fillRect(sx - 2, sy - 3, 5, 1); ctx.fillRect(sx - 2, sy - 1, 5, 1);
      ctx.fillStyle = '#5bb04a'; ctx.fillRect(sx - 2, sy - 2, 5, 1);
    }
    const list = [];
    reps.forEach(r => list.push([r.y, () => drawRep(r)]));
    if (dog) list.push([dog.y, drawDog]);
    if (hoa) list.push([hoa.y, drawHoa]);
    guests.forEach(gu => list.push([gu.y, () => drawGuest(gu)]));
    list.sort((a, b) => a[0] - b[0]).forEach(([, fn]) => fn());
    if (flyingPoster) {
      ctx.save();
      ctx.translate(Math.round(flyingPoster.x), Math.round(flyingPoster.y));
      ctx.rotate(flyingPoster.spin);
      drawPoster(ctx, -6, -4);
      ctx.restore();
    }
    for (const p of particles) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
    if (flood.flash > 0) {
      ctx.fillStyle = `rgba(255, 252, 225, ${Math.min(.85, flood.flash * 1.6)})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (!bubble.hidden && bubbleRep) {
      const r = bubbleRep;
      const hy = r.K.boss ? r.y - 7 - 26 * (.55 + .45 * r.hp / BOSS_HP) - 10 : r.y - 24 - (r.lift || 0);
      bubble.style.left = Math.max(30, Math.min(70, r.x / W * 100)) + '%';
      bubble.style.top = Math.max(14, hy / H * 100) + '%';
    }
  }

  let last = 0;
  function loop(ts) {
    const dt = last ? Math.min(.05, (ts - last) / 1000) : 0;
    last = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Wiring ----------
  function start(d) {
    audio();
    gameId++;
    pausedFrom = null;
    $('pauseScreen').hidden = true;
    day = d || day;
    reset();
    $('titleScreen').hidden = true;
    $('endScreen').hidden = true;
    doorScreen.hidden = true;
    phase = 'play';
    sfx.click();
    say(DAYS[day].intro, 2.8, reps[0]);
  }
  $('startBtn').addEventListener('click', () => start(day));
  $('againBtn').addEventListener('click', () => start(day));
  $('nextBtn').addEventListener('click', () => {
    $('endScreen').hidden = true;
    phase = 'title';
    setTitle(day + 1);
    $('titleScreen').hidden = false;
    updateHud();
    $('startBtn').focus({ preventScroll: true });
  });
  function bindGadget(id, fn) {
    $(id).addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
    $(id).addEventListener('click', e => { if (e.detail === 0) fn(); });
  }
  bindGadget('fireBtn', fire);
  bindGadget('dogBtn', sic);
  bindGadget('blowBtn', blow);
  bindGadget('garageBtn', slamGarage);
  bindGadget('floodBtn', floodlight);
  cv.addEventListener('pointerdown', fire);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || ((e.key === 'p' || e.key === 'P') && phase !== 'title' && phase !== 'over')) {
      if (phase === 'paused' || !$('pauseScreen').hidden) closeMenu(); else if (phase === 'play' || phase === 'door') openMenu();
      return;
    }
    if (phase === 'play') {
      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); fire(); }
      const k = e.key.toLowerCase();
      if (k === 'd') sic();
      if (k === 'b') blow();
      if (k === 'g') slamGarage();
      if (k === 'f') floodlight();
    }
    if (phase === 'door' && ['1', '2', '3'].includes(e.key)) { const b = $('card-' + (Number(e.key) - 1)); if (b) b.click(); }
  });
  $('sndBtn').addEventListener('click', () => {
    soundOn = !soundOn;
    $('sndBtn').setAttribute('aria-pressed', String(soundOn));
    $('sndBtn').textContent = 'Sound: ' + (soundOn ? 'on' : 'off');
    if (soundOn) { audio(); sfx.click(); }
  });
  $('bragBtn').addEventListener('click', () => {
    const text = bragText();
    const box = $('bragText');
    const fallback = () => { box.value = text; box.hidden = false; box.focus(); box.select(); $('bragBtn').textContent = 'Select and copy'; };
    try {
      navigator.clipboard.writeText(text).then(() => { $('bragBtn').textContent = 'Copied'; }, fallback);
    } catch (e) { fallback(); }
  });


  // ---------- Menu / pause ----------
  function openMenu() {
    const inGame = phase === 'play' || phase === 'door';
    if (inGame) { pausedFrom = phase; phase = 'paused'; hideBubble(); }
    $('pauseTitle').textContent = inGame ? 'Paused' : 'Menu';
    $('pauseDay').textContent = phase === 'title' ? 'Sunny Lane' : `${DAYS[day].name} · ${clockText()}`;
    $('resumeBtn').textContent = inGame ? 'Resume' : 'Close';
    $('restartBtn').hidden = phase === 'title';
    $('restartBtn').textContent = 'Restart ' + DAYS[day].name;
    $('titleBtn').hidden = phase === 'title';
    $('pauseScreen').hidden = false;
    updateHud();
    $('resumeBtn').focus({ preventScroll: true });
  }
  function closeMenu() {
    $('pauseScreen').hidden = true;
    if (pausedFrom) { phase = pausedFrom; pausedFrom = null; }
    updateHud();
  }
  function goTitle() {
    gameId++;
    pausedFrom = null;
    ['pauseScreen', 'endScreen'].forEach(id => { $(id).hidden = true; });
    doorScreen.hidden = true;
    phase = 'title';
    setTitle(day);
    $('titleScreen').hidden = false;
    updateHud();
    $('startBtn').focus({ preventScroll: true });
  }
  $('menuBtn').addEventListener('click', () => { if ($('pauseScreen').hidden) openMenu(); else closeMenu(); });
  $('resumeBtn').addEventListener('click', closeMenu);
  $('restartBtn').addEventListener('click', () => start(day));
  $('titleBtn').addEventListener('click', goTitle);
  $('menuEndBtn').addEventListener('click', goTitle);
  document.addEventListener('visibilitychange', () => { if (document.hidden && (phase === 'play' || phase === 'door')) openMenu(); });

  drawPortrait($('doorPortrait'), 'gary', false);
  setTitle(day);
  requestAnimationFrame(loop);
})();
</script>

</body>
